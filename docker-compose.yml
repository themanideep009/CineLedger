version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: cineledger-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - cineledger-network

  # CineLedger Backend Express API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cineledger-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/cineledger
      - JWT_SECRET=cineledger_production_jwt_secret_key_2026
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - cineledger-network

  # CineLedger Frontend React App Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cineledger-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - cineledger-network

volumes:
  mongodb_data:

networks:
  cineledger-network:
    driver: bridge
